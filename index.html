        { id: "tue", label: "Tue", date: "28 Jul" },

      const getMovie = (id) => MOVIES.find((m) => m.id === id);
      const isOccupied = (key) => {
        let h = 7;
        for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 9973;
        return h % 7 === 0;
      };
      const cn = (...a) => a.filter(Boolean).join(" ");

      /* ============================================================
         3. HASH ROUTER
         ============================================================ */
      const RouterCtx = createContext({ path: "/", go: () => {} });
      const useRouter = () => useContext(RouterCtx);

      function RouterProvider({ children }) {
        const [path, setPath] = useState(
          () => window.location.hash.replace(/^#/, "") || "/"
        );
        useEffect(() => {
          const on = () => setPath(window.location.hash.replace(/^#/, "") || "/");
          window.addEventListener("hashchange", on);
          return () => window.removeEventListener("hashchange", on);
        }, []);
        const go = useCallback((to) => {
          window.location.hash = to;
          window.scrollTo({ top: 0 });
        }, []);
        return <RouterCtx.Provider value={{ path, go }}>{children}</RouterCtx.Provider>;
      }

      function Link({ to, className, children, onClick }) {
        const { go } = useRouter();
        return (
          <a
            href={"#" + to}
            className={className}
            onClick={(e) => {
              e.preventDefault();
              onClick && onClick();
              go(to);
            }}
          >
            {children}
          </a>
        );
      }

      /* ============================================================
         4. BOOKING STATE (Context)
         ============================================================ */
      const BookingCtx = createContext(null);
      const useBooking = () => useContext(BookingCtx);

      function BookingProvider({ children }) {
        const [movieId, setMovieId] = useState(null);
        const [showtimeId, setShowtimeId] = useState(null);
        const [seats, setSeats] = useState([]);

        const setMovie = useCallback((id) => {
          setMovieId((prev) => {
            if (prev !== id) { setSeats([]); setShowtimeId(null); }
            return id;
          });
        }, []);
        const setShowtime = useCallback((id) => { setShowtimeId(id); setSeats([]); }, []);
        const toggleSeat = useCallback((seat) => {
          setSeats((prev) =>
            prev.some((s) => s.id === seat.id)
              ? prev.filter((s) => s.id !== seat.id)
              : [...prev, seat].sort((a, b) => a.id.localeCompare(b.id))
          );
        }, []);
        const clear = useCallback(() => setSeats([]), []);
        const total = useMemo(
          () => seats.reduce((sum, s) => sum + (s.vip ? PRICE_VIP : PRICE_STANDARD), 0),
          [seats]
        );

        return (
          <BookingCtx.Provider
            value={{ movieId, showtimeId, seats, total, setMovie, setShowtime, toggleSeat, clear }}
          >
            {children}
          </BookingCtx.Provider>
        );
      }

      /* ============================================================
         6. COMPONENTS — HERO CAROUSEL / MOVIE CARD / SEAT MAP
         ============================================================ */
      function HeroCarousel({ movies }) {
        const [index, setIndex] = useState(0);
        const [trailer, setTrailer] = useState(false);
        const movie = movies[index];

        useEffect(() => {
          if (trailer) return;
          const t = setInterval(() => setIndex((i) => (i + 1) % movies.length), 7000);
          return () => clearInterval(t);
        }, [movies.length, trailer]);

        const go = (d) => setIndex((i) => (i + d + movies.length) % movies.length);

        return (
          <section className="relative h-[86vh] min-h-[560px] w-full overflow-hidden">
            {movies.map((m, i) => (
              <img
                key={m.id}
                src={m.backdrop}
                alt={m.title + " backdrop"}
                className={cn(
                  "absolute inset-0 h-full w-full object-cover transition-opacity duration-1000",
                  i === index ? "opacity-100" : "opacity-0"
                )}
              />
            ))}
            <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-black/10" />
            <div className="veil absolute inset-0" />

            <div className="relative mx-auto flex h-full max-w-7xl flex-col justify-end px-5 pb-20 sm:px-8">
              <div className="max-w-2xl">
                <div className="flex flex-wrap items-center gap-2 text-[11px] text-muted">
                  <span className="rounded-full border border-cyan/30 bg-cyan/10 px-2.5 py-1 font-medium text-cyan">
                    {movie.ageRating}
                  </span>
                  <span className="glass rounded-full border px-2.5 py-1">{movie.language}</span>
                  <span className="glass rounded-full border px-2.5 py-1">{movie.subtitles}</span>
                  {movie.rating > 0 && (
                    <span className="flex items-center gap-1">
                      <I.star className="h-3 w-3 text-cyan" /> {movie.rating.toFixed(1)} IMDb
                    </span>
                  )}
                  <span>{movie.runtime}</span>
                </div>

                <h1 className="mt-5 text-5xl font-semibold leading-[0.95] sm:text-7xl">
                  {movie.title}
                </h1>
                <p className="mt-4 max-w-xl text-base leading-relaxed text-muted sm:text-lg">
                  {movie.tagline}
                </p>

                <div className="mt-8 flex flex-wrap gap-3">
                  <Link
                    to={"/movies/" + movie.id}
                    className="glow-cyan rounded-full bg-cyan px-6 py-3 text-sm font-semibold text-black transition-transform hover:scale-[1.03] active:scale-95"
                  >
                    Book Now
                  </Link>
                  <button
                    onClick={() => setTrailer(true)}
                    className="glass inline-flex items-center gap-2 rounded-full border px-6 py-3 text-sm font-medium hover:bg-white/10"
                  >
                    <I.play /> Watch Trailer
                  </button>
                </div>
              </div>

              <div className="mt-12 flex items-center gap-4">
                <div className="flex gap-2">
                  {movies.map((m, i) => (
                    <button
                      key={m.id}
                      aria-label={"Show " + m.title}
                      onClick={() => setIndex(i)}
                      className={cn(
                        "h-[3px] rounded-full transition-all duration-300",
                        i === index ? "w-10 bg-cyan" : "w-5 bg-white/25 hover:bg-white/50"
                      )}
                    />
                  ))}
                </div>
                <div className="ml-auto flex gap-2">
                  <button aria-label="Previous" onClick={() => go(-1)} className="glass rounded-full border p-2.5 hover:bg-white/10">
                    <I.left />
                  </button>
                  <button aria-label="Next" onClick={() => go(1)} className="glass rounded-full border p-2.5 hover:bg-white/10">
                    <I.right />
                  </button>
                </div>
              </div>
            </div>

            {trailer && (
              <div
                className="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 p-5 backdrop-blur-md"
                onClick={() => setTrailer(false)}
              >
                <div
                  className="w-full max-w-3xl overflow-hidden rounded-3xl border bg-surface"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="relative aspect-video">
                    <img src={movie.backdrop} alt="" className="h-full w-full object-cover opacity-50" />
                    <div className="absolute inset-0 flex flex-col items-center justify-center gap-3">
                      <span className="flex h-16 w-16 items-center justify-center rounded-full bg-cyan/20 text-cyan ring-1 ring-cyan/40">
                        <I.play className="h-6 w-6" fill="currentColor" />
                      </span>
                      <p className="text-sm text-muted">
                        Trailer preview — {movie.title} ({movie.runtime})
                      </p>
                    </div>
                    <button
                      aria-label="Close trailer"
                      onClick={() => setTrailer(false)}
                      className="glass absolute right-4 top-4 rounded-full border p-2"
                    >
                      <I.x />
                    </button>
                  </div>
                </div>
              </div>
            )}
          </section>
        );
      }

                <span className="glass rounded-full border px-2 py-0.5 text-[10px] font-medium">{movie.language}</span>
              </div>
              {movie.rating > 0 && (
                <span className="glass absolute right-3 top-3 flex items-center gap-1 rounded-full border px-2 py-0.5 text-[10px] font-semibold">

              <div className="absolute inset-x-0 bottom-0 p-4">

            </div>

              {movie.showtimes.length > 0 ? (
                movie.showtimes.slice(0, 4).map((s) => (

                ))

      }

      const STANDARD_ROWS = ["A", "B", "C", "D", "E", "F"];
      const VIP_ROWS = ["G", "H"];

      function SeatMap({ showtimeId }) {
        const { seats, toggleSeat } = useBooking();
        const isSelected = (id) => seats.some((s) => s.id === id);

        const row = (r, cols, vip) => (
          <div key={r} className="flex items-center justify-center gap-1.5 sm:gap-2">
            <span className="w-4 text-[10px] text-muted">{r}</span>
            <div className={cn("flex gap-1.5 sm:gap-2", !vip && "flex-wrap justify-center")}>
              {Array.from({ length: cols }).map((_, i) => {
                const id = r + (i + 1);
                const occupied = isOccupied(showtimeId + "-" + id);
                const selected = isSelected(id);
                return (
                  <button
                    key={id}
                    disabled={occupied}
                    aria-label={"Seat " + id + (vip ? " VIP" : "") + (occupied ? " occupied" : "")}
                    onClick={() => toggleSeat({ id, vip })}
                    className={cn(
                      "rounded-md border text-[9px] font-medium transition-all duration-150",
                      vip ? "h-7 w-10 rounded-lg sm:w-12" : "h-6 w-6 sm:h-7 sm:w-7",
                      occupied && "cursor-not-allowed border-white/5 bg-white/5 text-white/15",
                      !occupied && !selected &&
                        (vip
                          ? "border-crimson/40 text-crimson/80 hover:border-crimson hover:bg-crimson/15"
                          : "bg-surface2 text-muted hover:border-cyan/60 hover:text-cyan"),
                      selected && "glow-cyan border-cyan bg-cyan text-black"
                    )}
                  >
                    {occupied ? "" : i + 1}
                  </button>
                );
              })}
            </div>
            <span className="w-4" />
          </div>
        );

        return (
          <div className="rounded-3xl border bg-surface/60 p-5 sm:p-8">
            <div className="mx-auto max-w-lg">
              <div className="screen-glow mx-auto h-[3px] w-4/5 rounded-full bg-cyan" />
              <p className="mt-3 text-center text-[10px] uppercase tracking-[0.3em] text-cyan/70">Screen</p>
            </div>

            <div className="mt-10 space-y-2 sm:space-y-2.5">
              {STANDARD_ROWS.map((r) => row(r, 12, false))}
              <div className="py-3">
                <p className="text-center text-[10px] uppercase tracking-[0.25em] text-muted">VIP Couches</p>
              </div>
              {VIP_ROWS.map((r) => row(r, 8, true))}
            </div>

            <div className="mt-8 flex flex-wrap justify-center gap-x-5 gap-y-2 border-t pt-5 text-[11px] text-muted">
              <Legend cls="border bg-surface2" label="Available" />
              <Legend cls="border-cyan bg-cyan" label="Selected" />
              <Legend cls="border border-white/5 bg-white/5" label="Occupied" />
              <Legend cls="border border-crimson/40 bg-crimson/15" label="VIP couch · 600 ETB" />
            </div>
          </div>
        );
      }

      const Legend = ({ cls, label }) => (
        <span className="flex items-center gap-2">
          <span className={cn("h-3.5 w-3.5 rounded", cls)} />
          {label}

      );

      const Row = ({ label, value }) => (
        <div className="flex gap-4">
          <dt className="w-24 shrink-0 text-xs uppercase tracking-wide text-muted">{label}</dt>
          <dd className="flex-1 text-sm">{value}</dd>

                    <h2 className="mt-3 text-4xl font-semibold sm:text-5xl">The programme</h2>

              </div>
            </section>

            <section className="mx-auto max-w-7xl px-5 pb-8 sm:px-8">
              <div className="relative overflow-hidden rounded-4xl border">
                <img
                  src={U("1489599849927-2ee91cede3ba", 2000)}
                  alt="Gast Cinema auditorium"
                  loading="lazy"
                  className="h-[360px] w-full object-cover"
                />
                <div className="absolute inset-0 bg-gradient-to-r from-black via-black/60 to-transparent" />
                <div className="absolute inset-0 flex flex-col justify-center gap-4 p-8 sm:p-14">
                  <h3 className="max-w-md text-3xl font-semibold sm:text-4xl">

         ============================================================ */

        if (!movie) return <NotFound />;
        const active = movie.showtimes.find((s) => s.id === showtimeId) || null;

        return (
          <div className="pb-40">

                  <div className="max-w-2xl">

                      <span className="rounded-full border border-cyan/30 bg-cyan/10 px-2.5 py-1 text-cyan">{movie.ageRating}</span>
                      <span className="glass rounded-full border px-2.5 py-1">{movie.language}</span>
                      <span className="glass rounded-full border px-2.5 py-1">{movie.subtitles}</span>
                      {movie.rating > 0 && (
                        <span className="flex items-center gap-1"><I.star className="h-3 w-3 text-cyan" /> {movie.rating.toFixed(1)}</span>
                      )}
                      <span className="flex items-center gap-1"><I.clock className="h-3 w-3" /> {movie.runtime}</span>
                    </div>
                    <h1 className="mt-4 text-4xl font-semibold sm:text-6xl">{movie.title}</h1>
                    <p className="mt-3 text-sm text-muted sm:text-base">{movie.tagline}</p>
                  </div>
                </div>
              </div>
            </section>

            <section className="mx-auto max-w-7xl px-5 py-14 sm:px-8">
              <div className="grid gap-12 lg:grid-cols-[1.6fr_1fr]">
                <div>
                  <h2 className="text-xl font-semibold">Synopsis</h2>
                  <p className="mt-3 leading-relaxed text-muted">{movie.synopsis}</p>
                </div>
                <dl className="space-y-4 rounded-3xl border bg-surface/60 p-6 text-sm">
                  <Row label="Director" value={movie.director} />
                  <Row label="Cast" value={movie.cast.join(", ")} />
                  <Row label="Genre" value={movie.genres.join(" · ")} />
                  <Row label="Audio" value={movie.language + " · Dolby Atmos"} />
                  <Row label="Subtitles" value={movie.subtitles} />
                </dl>
              </div>
            </section>

            <section className="mx-auto max-w-7xl px-5 sm:px-8">
              <h2 className="text-3xl font-semibold sm:text-4xl">Choose your seats</h2>

              {movie.showtimes.length === 0 ? (
                <p className="mt-4 text-sm text-muted">
                  {movie.releaseNote || "Booking opens closer to release."} Follow our Telegram
                  channel to be notified when tickets go live.
                </p>

                <React.Fragment>
                  <p className="mt-2 text-sm text-muted">
                    Standard {PRICE_STANDARD} ETB · VIP couch {PRICE_VIP} ETB
                  </p>

                  <div className="mt-6 flex flex-wrap gap-2.5">
                    {movie.showtimes.map((s) => (
                      <button
                        key={s.id}
                        onClick={() => setShowtime(s.id)}
                        className={cn(
                          "rounded-2xl border px-4 py-3 text-left transition-all",

                        <span className={cn("block text-sm font-semibold", showtimeId === s.id && "text-cyan")}>

                        <span className="text-[11px] text-muted">{s.hall} · {s.format}</span>

                      <SeatMap showtimeId={active.id} />

                      <div className="rounded-3xl border border-dashed bg-surface/30 p-14 text-center text-sm text-muted">

                    <p className="text-xs text-muted">{movie.title} · {active.time} · {active.hall}</p>

                  <p className="text-xl font-semibold text-cyan">{total.toLocaleString()} ETB</p>
                  <button onClick={clear} className="rounded-full border px-3 py-2 text-xs text-muted hover:text-white">

                    onClick={() => setConfirmed(true)}
                    className="glow-cyan rounded-full bg-cyan px-5 py-2.5 text-sm font-semibold text-black"
                  >
                    Confirm Booking
                  </button>
                </div>
              </div>
            )}

            {confirmed && active && (
              <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 p-5 backdrop-blur-md">
                <div className="w-full max-w-md rounded-3xl border bg-surface p-8 text-center">
                  <button aria-label="Close" onClick={() => setConfirmed(false)} className="ml-auto block text-muted">

                  <span className="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-cyan/15 text-cyan ring-1 ring-cyan/30">

                  <button
                    onClick={() => { setConfirmed(false); clear(); }}
                    className="mt-6 w-full rounded-full bg-cyan py-3 text-sm font-semibold text-black"

                    Done
                  </button>
                </div>
              </div>
            )}
          </div>
        );

              <div className="mt-10 divide-y overflow-hidden rounded-3xl border bg-surface/50">
                {showing.map((m) => (
                  <div key={m.id} className="flex flex-col gap-4 p-5 sm:flex-row sm:items-center sm:p-6">

                        <p className="truncate font-semibold">{m.title}</p>
                        <p className="text-xs text-muted">{m.runtime} · {m.language} · {m.ageRating}</p>
                      </div>
                    </Link>
                    <div className="flex flex-wrap gap-2">
                      {m.showtimes.map((s) => (
                        <Link
                          key={s.id}
                          to={"/movies/" + m.id}
                          className="rounded-xl border bg-surface2 px-3 py-2 text-xs transition-colors hover:border-cyan/60 hover:text-cyan"
                        >
                          <span className="font-medium">{s.time}</span>
                          <span className="ml-2 text-muted">{s.hall}</span>
                        </Link>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

                      <p className="leading-relaxed text-muted">{f.body}</p>

              <div className="mt-16 rounded-4xl border bg-surface/50 p-8 sm:p-12">

                <div className="mt-8 grid gap-x-12 gap-y-4 sm:grid-cols-2">
                  {MENU.map(([name, price]) => (

              <div className="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-black/20" />
              <div className="veil absolute inset-0" />
              <div className="relative mx-auto flex h-full max-w-7xl flex-col justify-end px-5 pb-12 sm:px-8">
                <p className="text-xs uppercase tracking-[0.2em] text-cyan">Addis Ababa</p>
                <h1 className="mt-3 text-4xl font-semibold sm:text-6xl">CMC, next to Century Mall</h1>

            </section>

            <div className="mx-auto max-w-7xl px-5 py-16 sm:px-8">
              <div className="grid gap-6 md:grid-cols-3">
                {DIRECTIONS.map((d) => (
                  <div key={d.title} className="rounded-3xl border bg-surface/50 p-7">
                    <span className="flex h-10 w-10 items-center justify-center rounded-xl bg-cyan/15 text-cyan ring-1 ring-cyan/30">
                      <d.icon />
                    </span>
                    <h2 className="mt-5 text-xl font-semibold">{d.title}</h2>
                    <p className="mt-2 text-sm leading-relaxed text-muted">{d.body}</p>
                  </div>
                ))}
              </div>

              <div className="mt-8 grid gap-6 lg:grid-cols-2">
                <div className="rounded-3xl border bg-surface/50 p-8">
                  <h2 className="text-2xl font-semibold">Opening hours</h2>
                  <ul className="mt-6 space-y-3 text-sm">
                    {HOURS.map(([d, h]) => (
                      <li key={d} className="flex justify-between border-b border-dashed pb-3">
                        <span className="text-muted">{d}</span>
                        <span className="font-medium">{h}</span>
                      </li>
                    ))}

                        <span className="mt-0.5 shrink-0 text-cyan"><I.pin /></span>
                        <span className="text-muted">
                          Gast Cinema, CMC Area, Next to Century Mall, Addis Ababa, Ethiopia
                        </span>
                      </p>
                      <p className="flex gap-3">
                        <span className="mt-0.5 shrink-0 text-cyan"><I.phone /></span>
                        <a href="tel:+251930113388" className="hover:text-cyan">+251 930 113388</a>
                      </p>
                    </div>
                    <a
                      href="https://maps.google.com/?q=Century+Mall+CMC+Addis+Ababa"

                    >
                      Open in Maps
                    </a>
                  </div>
                  <div className="overflow-hidden rounded-3xl border">
                    <img
                      src={U("1524661135-423995f22d0b", 1400)}
                      alt="Aerial view of the CMC neighbourhood"
                      loading="lazy"
                      className="h-56 w-full object-cover"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      /* ============================================================
         12. 404 + APP SHELL
         ============================================================ */
      function NotFound() {
        return (
          <div className="flex min-h-[60vh] flex-col items-center justify-center px-4 text-center">
            <h1 className="text-7xl font-bold">404</h1>
            <h2 className="mt-4 text-xl font-semibold">Page not found</h2>
            <p className="mt-2 text-sm text-muted">That screening doesn't exist or has been moved.</p>
            <Link to="/" className="mt-6 rounded-full bg-cyan px-4 py-2 text-sm font-medium text-black">
              Go home
            </Link>
          </div>
        );
      }

      function Routes() {
        const { path } = useRouter();
        if (path === "/") return <HomePage />;
        if (path === "/schedule") return <SchedulePage />;
        if (path === "/experience") return <ExperiencePage />;
        if (path === "/location") return <LocationPage />;
        if (path.startsWith("/movies/")) return <MoviePage id={path.split("/movies/")[1]} />;
        return <NotFound />;
      }

      function App() {
        return (
          <RouterProvider>
            <BookingProvider>
              <div className="flex min-h-screen flex-col bg-black">
                <Header />
                <main className="flex-1"><Routes /></main>
                <Footer />
              </div>
            </BookingProvider>
          </RouterProvider>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
